# =============================================================================
# CKA-Agent API Proxy Configuration
# =============================================================================
# This file defines how the proxy translates OpenAI-compatible requests
# from the CKA-Agent into requests for your target API.
#
# Copy this file to proxy_config.yml and edit to match your target API.
# =============================================================================

# Proxy server settings
server:
  host: "127.0.0.1"
  port: 8081

# Target API configuration
target:
  # The URL to send requests to
  url: "https://api.example.com/v1/generate"

  # HTTP method (GET, POST, PUT, etc.)
  method: "POST"

  # Headers to send with every request to the target API
  # Use ${ENV_VAR} syntax to reference environment variables
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer ${TARGET_API_KEY}"

  # Request timeout in seconds
  timeout: 120

# =============================================================================
# Request Template (Jinja2)
# =============================================================================
# Define how to transform the incoming OpenAI request into your target API format.
#
# Available variables in the template:
#   - messages:     List of message dicts [{"role": "user", "content": "..."}]
#   - prompt:       The last user message as a plain string
#   - model:        The model name from the request
#   - temperature:  Temperature value from the request
#   - max_tokens:   Max tokens from the request
#   - top_p:        Top-p value from the request
#   - full_request: The entire original OpenAI request dict
#
# The template must produce valid JSON.
# =============================================================================
request_template: |
  {
    "prompt": "{{ prompt }}",
    "max_tokens": {{ max_tokens }},
    "temperature": {{ temperature }}
  }

# =============================================================================
# Response Extraction
# =============================================================================
# Define how to extract the generated text from the target API's response.
#
# Uses a dot-notation path to navigate the JSON response.
# Examples:
#   "output.text"              -> response["output"]["text"]
#   "results.0.generated_text" -> response["results"][0]["generated_text"]
#   "choices.0.message.content"-> response["choices"][0]["message"]["content"]
#   "text"                     -> response["text"]
#   ""                         -> treat entire response body as plain text
# =============================================================================
response_extract: "output.text"


